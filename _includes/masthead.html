{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Navigasi utama">
        <button class="abp-nav-toggle" aria-label="Buka menu">
          <img src="{{ base_path }}/images/abp-logo.svg" alt="" aria-hidden="true">
        </button>

        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist abp-brand {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/" aria-label="{{ site.title }}">
              <img src="{{ base_path }}/images/abp-logo.svg" alt="{{ site.title }}" class="abp-brand__logo">
            </a>
          </li>

          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}

          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon" title="Ganti tema">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
